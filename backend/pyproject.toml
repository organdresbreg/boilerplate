[project]
name = "backend"
version = "2.0.0"
description = "Backend API for Modern Full-Stack Boilerplate 2026"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.122.0",
    "uvicorn[standard]==0.35.2",
    "sqlmodel==0.0.24",
    "pydantic==2.11.0",
    "pydantic-settings==2.8.1",
    "python-jose[cryptography]==3.4.0",
    "bcrypt==4.2.1",
    "aiosqlite==0.21.0",
    "sqlalchemy[asyncio]==2.0.38",
    "alembic==1.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.9.4",
    "pip-audit==2.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
