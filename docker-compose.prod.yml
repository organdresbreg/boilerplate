version: '3.8'

services:
  # Servicio de migraciones de base de datos (se ejecuta una vez y termina)
  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-appuser}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-appdb}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net
    restart: "no"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
    container_name: modular-app-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-appuser}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-appdb}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal-net
      - web-net
    # Límites de recursos (ajustar según necesidades reales)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Frontend (Sirviendo estáticos optimizados vía Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: modular-app-frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # Base de Datos PostgreSQL (Producción)
  db:
    image: postgres:16-alpine
    container_name: modular-app-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-appuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_DB=${DB_NAME:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Nginx Reverse Proxy (Opcional, si se desea manejar SSL/TLS aquí)
  # Si usas un proveedor de cloud o Kubernetes, esto podría manejarse externamente.
  # Para Docker standalone, es útil para terminar SSL.
  nginx:
    image: nginx:alpine
    container_name: modular-app-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443" # Descomentar si se montan certificados SSL
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro # Montar certificados si es necesario
    depends_on:
      - backend
      - frontend
    networks:
      - web-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 32M

networks:
  internal-net:
    driver: bridge
    internal: true # Aísla la DB y el backend del acceso externo directo
  web-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
