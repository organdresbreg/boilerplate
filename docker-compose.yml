version: '3.8'

services:
  # Backend: FastAPI + Python 3.13 (SQLite - no requiere servicio DB externo)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boilerplate_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: /app/data/app.db
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    command: >
      sh -c "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - jaeger

  # Frontend: Preact + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boilerplate_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Jaeger: OpenTelemetry tracing (solo desarrollo)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: boilerplate_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles:
      - monitoring

volumes:
  sqlite_data:

networks:
  default:
    name: boilerplate-network
